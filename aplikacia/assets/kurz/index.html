*{box-sizing:border-box}
html,body{height:100%;margin:0}

.dv{flex:0 0 28px;position:relative;background:var(--line);cursor:row-resize;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none}
.dv::before{content:"";position:absolute;left:0;right:0;top:-12px;bottom:-12px}
.dv::after{content:"";width:56px;height:6px;border-radius:3px;background:var(--muted)}

#les h2{font-size:17px;margin:0 0 6px}
#les p,#les ul{margin:6px 0}
#les code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}
.task{border-left:3px solid var(--acc);padding:6px 10px;margin:10px 0;background:var(--bg)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px;font:inherit;font-size:14px}
.tabs button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
textarea{flex:1;border:0;resize:none;outline:0;padding:10px;background:var(--panel);color:var(--text);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2}
iframe{flex:1;border:0;background:#fff;width:100%}
footer{display:flex;gap:8px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);background:var(--panel)}
#msg{flex:1;font-size:13px;line-height:1.3}
button.p{font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:var(--acc-t);font-weight:600}
button.s{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--text)}
#crs{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#crs button{flex:1;font:inherit;font-size:13px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#crs button.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc);font-weight:600}
#crs button.lk{opacity:.55}
</style>
</head>

{t:"Čo je webová stránka",tab:"h",x:'<p>Každá stránka má tri vrstvy:</p><ul><li><b>HTML</b> je kostra: čo na stránke je (nadpisy, texty, zoznamy).</li><li><b>CSS</b> je vzhľad: farby, veľkosti, rámiky.</li><li><b>JavaScript</b> je správanie: čo sa stane po kliknutí.</li></ul><p>Začíname HTML. Obsah obaľujeme <b>značkami</b>, ktoré majú začiatok a koniec: <code>&lt;h1&gt;Ahoj&lt;/h1&gt;</code>. Značka <code>h1</code> je hlavný nadpis. Výsledok vidíš hneď dole v náhľade.</p>',task:"Do karty HTML napíš nadpis h1 s ľubovoľným textom.",s:{h:"<p>Vitaj!</p>"},hint:"Napíš: <h1>Môj nadpis</h1>",
